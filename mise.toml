# Dev tools scoped to this repository (separate from the global config mise/mise.toml).
# Setup: mise trust . && mise install --locked && hk install
[tools]
hk          = "2.8.1"   # git hooks (hk.pkl)
betterleaks = "1.9.0"   # secret scan (self-contained binary)
shellcheck  = "0.11.0"  # tools/*.sh
"github:jdx/jactionlint" = "v2.3.0"  # GitHub Actions lint (when workflows are added)
pinact      = "5.0.2"   # `uses:` must be pinned to a commit SHA

# paranoid is a global-only setting (mise ignores it in project configs)
[settings]
locked              = true
minimum_release_age = "2d"
pin                 = true

# --- Host entry points (see README.md) ---------------------------------------
[tasks.check]
description = "読み取りのみ: リモートとの差分・ドリフト・野良を確認する"
alias = "c"
run = "tools/check.sh"

[tasks.update]
description = "origin/main の内容だけをホストへ適用して検証する"
alias = "u"
run = "tools/update.sh"

[tasks.compare]
description = "Nix と mise の検証レベルを比較する: mise run compare -- <nixpkgs-attr> [<mise-tool>]"
run = "tools/compare-source.sh"

[tasks.lint]
description = "全ファイルに hk の pre-commit チェック + nix flake check（pre-push 相当）"
run = [
  "hk run pre-commit --all",
  "nix flake check --impure --no-build",
]
