# Global mise config for the macOS host. tools/update.sh copies this to ~/.config/mise/config.toml.
# (Kept under the name mise.toml so mise does not treat it as a project config inside the repo.)
#
# Only tools whose decision in AUDIT.md is "mise" belong here (AGENTS.md: Nix first, mise when its
# verification level is clearly higher, or when nixpkgs cannot provide it). Exact pins only.
[tools]
# Moved from Nix (nixpkgs had not packaged a newer release for 39 / 102 days, AUDIT.md).
pnpm                          = "12.19.0"
"npm:textlint"                = "15.8.0"
# obscura: headless browser for AI agents. nixpkgs had 0.2.2 (53 days behind). No checksums or
# attestation upstream: the hash mise records in mise.lock on first lock is what is enforced.
# The plain (not stealth / no-render) build, chosen per platform.
"github:h4ckf0r0day/obscura"  = { version = "v0.2.6", platforms = { macos-arm64 = { asset_pattern = "obscura-aarch64-macos.tar.gz" }, linux-x64 = { asset_pattern = "obscura-x86_64-linux.tar.gz" } } }
"aqua:k1LoW/mo"               = "1.7.0"
"github:microsoft/waza"       = "v0.39.0"
"aqua:microsoft/tgrep"        = "1.2.4"
"github:init-co-jp/diff-tour" = "v0.6.0"
# ax: not in nixpkgs. github backend verifies the published checksums.txt (ubi: had none).
"github:yusukebe/ax"          = "v0.1.25"
# T3 Code CLI (`t3`). The desktop app is the vendor DMG (exceptions.tsv); nixpkgs lagged 1,169 commits.
"npm:t3"                      = "0.1.8"
# agent-desktop: Vercel Labs desktop automation CLI (darwin / win32 / linux). Not in nixpkgs.
# npm SLSA provenance; the postinstall links the bundled native binary, so allow only its build.
"npm:agent-desktop"           = { version = "1.2.0", allow_builds = ["agent-desktop"] }
"npm:secretlint"              = "13.0.7"

[settings]
paranoid                 = true
locked                   = true
locked_verify_provenance = true
minimum_release_age      = "2d"
pin                      = true

[settings.npm]
# aube (mise's built-in installer) verifies npm provenance at install time. With paranoid on,
# mise >= 2026.11 refuses pnpm/npm as the installer because they cannot. It writes its resolved
# dependency graph to ~/.config/mise/locks/ on install (host-local, not tracked).
package_manager = "aube"

[settings.pypi]
registry_url = "https://pypi.flatt.tech/simple/{}/"

[env]
PIP_REQUIRE_VIRTUALENV = "true"
PIP_INDEX_URL          = "https://pypi.flatt.tech/simple/"
UV_INDEX_URL           = "https://pypi.flatt.tech/simple/"
NPM_CONFIG_REGISTRY    = "https://npm.flatt.tech/"
