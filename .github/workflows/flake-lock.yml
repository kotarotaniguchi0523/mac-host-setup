# Weekly flake.lock update: each input moves to its newest commit that is at least 2 days old
# (tools/ci/flake-lock-update.sh). ci.yml is dispatched on the PR branch and builds the system there
# (pushes made with GITHUB_TOKEN do not trigger workflows by themselves).
name: flake-lock

on:
  schedule:
    - cron: "0 21 * * 0" # Mon 06:00 JST
  workflow_dispatch:

permissions: {}

concurrency:
  group: flake-lock
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update:
    name: update flake.lock
    runs-on: macos-26
    permissions:
      contents: write # push the update branch
      pull-requests: write # open / update the PR
      actions: write # dispatch ci.yml on the PR branch
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: flake-lock/update
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: artipacked -- needed to push the update branch
      - name: install Nix
        run: tools/install-nix.sh
      - name: update flake.lock (inputs >= 2 days old)
        id: lock
        run: tools/ci/flake-lock-update.sh
      - name: push, open / update the PR, start ci
        if: steps.lock.outputs.changed == 'true'
        run: |
          tools/ci/push-and-dispatch.sh "$BRANCH" "chore(deps): update flake.lock (inputs >= 2 days old)" flake.lock
          if [[ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]]; then
            gh pr create --head "$BRANCH" --base main --title "chore(deps): update flake.lock" \
              --body "Inputs moved to their newest commits that are at least 2 days old (tools/ci/flake-lock-update.sh). ci.yml builds the system on this branch."
          fi
          # Merge as soon as the required checks (lint / mise-lock / nix) pass, like Renovate's
          # minor / patch updates. A merge made with GITHUB_TOKEN starts no push workflows on main.
          gh pr merge "$BRANCH" --squash --auto
