# CI for mac-host-setup. Every check is a script under tools/ (reproducible locally).
#  - changes  : which areas the change touches (tools/ci/changes.sh); the jobs below skip themselves
#               with `if:` when untouched. A job skipped by `if:` counts as passed for the required
#               checks, whereas a workflow filtered by `paths:` would leave them pending forever.
#  - lint     : hk pre-commit steps on all files (betterleaks / shellcheck / pii / jactionlint / pinact)
#               -- always (cheap, and pii / secrets must see every change)
#  - mise-lock: mise lockfiles are complete and up to date (global lane + dev tools)
#  - nix      : install Nix with tools/install-nix.sh, nixfmt, flake check, build the full system
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

# Keyed by branch, so the run that mise-relock / flake-lock dispatch on a PR branch replaces the
# PR's own run (which saw the stale lockfile).
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      nix: ${{ steps.diff.outputs.nix }}
      mise: ${{ steps.diff.outputs.mise }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the base commit must be present for the diff
      - id: diff
        env:
          # PR: its base; push: the previous tip; workflow_dispatch: empty -> every area
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: tools/ci/changes.sh "$BASE" HEAD

  lint:
    name: lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # pii-check inspects commit author emails
      - uses: ./.github/actions/setup-mise
        with:
          install: "true"
      - name: hk (all files)
        env:
          HK_SKIP_STEPS: nixfmt,flake-check # need Nix; run in the nix job
        run: hk run pre-commit --all

  mise-lock:
    name: mise-lock
    needs: changes
    if: needs.changes.outputs.mise == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      - name: lockfiles are up to date
        env:
          GITHUB_TOKEN: ${{ github.token }} # GitHub API rate limit for release lookups
        run: tools/ci/mise-lock.sh --check

  nix:
    name: nix
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install Nix (pinned + verified, same script as the host)
        run: tools/install-nix.sh
      - name: CI mise matches flake.lock
        run: tools/ci/check-mise-version.sh
      - name: nixfmt / flake check / build
        run: tools/ci/nix-check.sh
