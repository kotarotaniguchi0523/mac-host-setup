name: setup-mise
description: >-
  jdx/mise-action with the same mise as the host: the version pinned in pkgs/mise-bin.json
  (lockfile fields differ between mise versions, so CI and the host must match).
inputs:
  install:
    description: install the tools of ./mise.toml
    default: "false"
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: echo "version=$(jq -r .version pkgs/mise-bin.json)" >> "$GITHUB_OUTPUT"
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: ${{ steps.pin.outputs.version }}
        install: ${{ inputs.install }}
        cache: true
