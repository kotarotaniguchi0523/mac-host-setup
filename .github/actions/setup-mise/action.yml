name: setup-mise
description: >-
  jdx/mise-action with the same mise as the host. The version must equal nixpkgs' mise in
  flake.lock (lockfile fields differ between mise versions); tools/ci/check-mise-version.sh
  fails the nix job when they drift.
inputs:
  install:
    description: install the tools of ./mise.toml
    default: "false"
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: 2026.10.17
        install: ${{ inputs.install }}
        cache: true
